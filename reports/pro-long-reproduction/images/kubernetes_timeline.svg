<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes execution timeline</title>
  <desc id="desc">Four wrapper-failure jobs were followed by four successful setup-gate jobs; the queue-verified campaign lasted 223.362 seconds.</desc>
  <rect width="1100" height="600" fill="#fbfaf7"/>
  <text x="70" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#17212b">Kubernetes execution: two bounded waves</text>
  <text x="70" y="96" font-family="sans-serif" font-size="18" fill="#52606d">NVIDIA RTX PRO 6000 Blackwell cluster · CPU-only API workload · peak GPUs allocated: 0</text>
  <line x1="275" y1="505" x2="1010" y2="505" stroke="#8a949e" stroke-width="2"/>
  <g font-family="sans-serif" font-size="15" fill="#52606d" text-anchor="middle">
    <text x="275" y="535">0s</text><text x="459" y="535">60s</text><text x="643" y="535">120s</text><text x="827" y="535">180s</text><text x="957" y="535">223.4s</text>
  </g>
  <g font-family="sans-serif" font-size="17" fill="#17212b" text-anchor="end">
    <text x="250" y="160">Initial wrapper jobs ×4</text>
    <text x="250" y="245">Corrected full log</text><text x="250" y="305">Corrected last 25</text>
    <text x="250" y="365">Corrected no log</text><text x="250" y="425">Corrected stateless</text>
  </g>
  <rect x="275" y="135" width="31" height="34" rx="6" fill="#cf514b"/>
  <text x="320" y="158" font-family="sans-serif" font-size="16" fill="#8f2d29">5–10s · shell wrapper failure</text>
  <g fill="#4b8b6b">
    <rect x="747" y="220" width="209" height="34" rx="6"/>
    <rect x="750" y="280" width="209" height="34" rx="6"/>
    <rect x="753" y="340" width="194" height="34" rx="6"/>
    <rect x="756" y="400" width="160" height="34" rx="6"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">
    <text x="852" y="243">68s · done</text><text x="855" y="303">68s · done</text>
    <text x="850" y="363">63s · done</text><text x="836" y="423">52s · done</text>
  </g>
  <line x1="275" y1="555" x2="957" y2="555" stroke="#244a6a" stroke-width="3"/>
  <line x1="275" y1="545" x2="275" y2="565" stroke="#244a6a" stroke-width="3"/>
  <line x1="957" y1="545" x2="957" y2="565" stroke="#244a6a" stroke-width="3"/>
  <text x="616" y="585" font-family="sans-serif" font-size="18" font-weight="700" fill="#244a6a" text-anchor="middle">Queue-verified wall time: 223.362 seconds (0.062045 hours)</text>
</svg>
